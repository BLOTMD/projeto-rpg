<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Epic Battle</title>
</head>
<body>
    <!-- Titulo principal exibido acima da arena. -->
    <div class="centered">
        <h1>EPIC BATTLE</h1>
    </div>

    <!-- Arena com os dois cards dos jogadores. -->
    <div class="align arena">
        <div class="character-card" id="player-one-card">
            <!-- Selecao do personagem do jogador 1 antes da batalha comecar. -->
            <div class="selection-area">
                <label for="PlayerOneSelect">Player 1</label>
                <select name="Change character" id="PlayerOneSelect">
                    <option value="knight">Knight</option>
                    <option value="wizard">Wizard</option>
                    <option value="assassin">Assassin</option>
                    <option value="toothless">Toothless</option>
                    <option value="archer" selected>Archer</option>
                </select>
            </div>

            <img id="player-one-image"
                 src=""
                 alt="Player 1"
                 height="250"
                 width="400">

            <h2 id="player-one-name">Knight</h2>
            <h3 id="player-one-hp">HP: 300</h3>

            <div class="health-bar">
                <div id="player-one-health-bar" class="health"></div>
            </div>
        </div>

        <div class="vs">
            <h2>VS</h2>
        </div>

        <div class="character-card" id="player-two-card">
            <!-- Selecao do personagem do jogador 2 antes da batalha comecar. -->
            <div class="selection-area">
                <label for="PlayerTwoSelect">Player 2</label>
                <select name="Change character" id="PlayerTwoSelect">
                    <option value="knight">Knight</option>
                    <option value="wizard" selected>Wizard</option>
                    <option value="assassin">Assassin</option>
                    <option value="toothless">Toothless</option>
                    <option value="archer">Archer</option>
                </select>
            </div>

            <img id="player-two-image"
                 src=""
                 alt="Player 2"
                 height="250"
                 width="400">

            <h2 id="player-two-name">Wizard</h2>
            <h3 id="player-two-hp">HP: 200</h3>

            <div class="health-bar">
                <div id="player-two-health-bar" class="health"></div>
            </div>
        </div>
    </div>

    <!-- Botoes que controlam inicio, avanco de turno e reinicio da batalha. -->
    <div class="centered buttons">
        <button id="start-button">START</button>
        <button id="next-turn" disabled>NEXT TURN</button>
        <button id="restart">RESTART</button>
    </div>

    <!-- Area onde o JavaScript escreve o historico dos ataques e curas. -->
    <div class="console">
        <h2>Battle Log</h2>
        <div id="log">
            Choose the characters and click START to begin the battle.
        </div>
    </div>

    <!-- Arquivo gerado a partir do TypeScript para rodar o jogo no navegador. -->
    <script type="module" src="rungame.js"></script>
</body>
</html>
